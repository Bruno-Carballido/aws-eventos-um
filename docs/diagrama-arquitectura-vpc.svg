<svg viewBox="0 0 1000 1140" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#111"/>
    </marker>
  </defs>

  <rect width="1000" height="1140" fill="#fdfdf8"/>

  <!-- Caja: Navegador -->
  <rect x="380" y="30" width="240" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="500" y="72" text-anchor="middle" font-size="24" font-weight="700" fill="#111">Navegador</text>

  <!-- Caja: Amazon S3 -->
  <rect x="730" y="20" width="255" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="857" y="55" text-anchor="middle" font-size="24" font-weight="700" fill="#111">Amazon S3</text>
  <text x="857" y="85" text-anchor="middle" font-size="16" fill="#111">sitio estático (web)</text>

  <!-- Flecha Navegador -> S3 -->
  <line x1="620" y1="65" x2="722" y2="65" stroke="#111" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="671" y="50" text-anchor="middle" font-size="17" fill="#111">HTTP</text>

  <!-- Flecha Navegador -> VPC -->
  <line x1="500" y1="100" x2="500" y2="195" stroke="#111" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="518" y="155" font-size="17" fill="#111">HTTP :80</text>

  <!-- VPC -->
  <rect x="40" y="200" width="945" height="560" rx="10" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="14,8"/>
  <text x="62" y="238" font-size="22" font-weight="700" fill="#111">VPC 10.20.0.0/16</text>

  <!-- Caja: Internet Gateway -->
  <rect x="350" y="212" width="300" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="500" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Internet Gateway</text>

  <line x1="500" y1="272" x2="500" y2="322" stroke="#111" stroke-width="2.5" marker-end="url(#flecha)"/>

  <!-- Subredes públicas -->
  <rect x="90" y="328" width="850" height="130" rx="10" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="10,7"/>
  <text x="112" y="360" font-size="18" font-weight="700" fill="#111">subredes públicas · 2 zonas</text>

  <!-- Caja: ALB -->
  <rect x="280" y="370" width="440" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="500" y="412" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Application Load Balancer</text>

  <!-- Flecha ALB -> subredes privadas -->
  <line x1="500" y1="440" x2="500" y2="532" stroke="#111" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="518" y="495" font-size="17" fill="#111">HTTP :8000</text>

  <!-- Subredes privadas -->
  <rect x="90" y="538" width="850" height="205" rx="10" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="10,7"/>
  <text x="112" y="568" font-size="18" font-weight="700" fill="#111">subredes privadas · 2 zonas</text>

  <!-- Caja: ECS Fargate -->
  <rect x="210" y="580" width="580" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="500" y="612" text-anchor="middle" font-size="22" font-weight="700" fill="#111">ECS Fargate (1 a 3 tareas)</text>
  <text x="500" y="648" text-anchor="middle" font-size="17" fill="#111">rutas: GET /eventos · POST /inscripciones</text>
  <text x="500" y="674" text-anchor="middle" font-size="17" fill="#111">GET /inscripciones · GET /health</text>
  <text x="500" y="706" text-anchor="middle" font-size="17" fill="#111">planificador APScheduler:</text>
  <text x="500" y="726" text-anchor="middle" font-size="17" fill="#111">recordatorios cada 1 h (en cada tarea)</text>

  <!-- Flecha ECS -> servicios -->
  <line x1="500" y1="743" x2="500" y2="802" stroke="#111" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="518" y="780" font-size="17" fill="#111">endpoints de VPC (sin NAT, sin Internet)</text>

  <!-- Distribución a los cuatro servicios -->
  <line x1="150" y1="802" x2="500" y2="802" stroke="#111" stroke-width="2.5"/>
  <line x1="870" y1="802" x2="500" y2="802" stroke="#111" stroke-width="2.5"/>
  <line x1="150" y1="802" x2="150" y2="832" stroke="#111" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="390" y1="802" x2="390" y2="832" stroke="#111" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="630" y1="802" x2="630" y2="832" stroke="#111" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="870" y1="802" x2="870" y2="832" stroke="#111" stroke-width="2.5" marker-end="url(#flecha)"/>

  <!-- Caja: DynamoDB -->
  <rect x="45" y="838" width="210" height="190" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="150" y="875" text-anchor="middle" font-size="22" font-weight="700" fill="#111">DynamoDB</text>
  <text x="150" y="910" text-anchor="middle" font-size="16" fill="#111">Eventos,</text>
  <text x="150" y="934" text-anchor="middle" font-size="16" fill="#111">Inscripciones</text>
  <text x="150" y="970" text-anchor="middle" font-size="14" fill="#333">(endpoint gateway)</text>

  <!-- Caja: SNS -->
  <rect x="285" y="838" width="210" height="190" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="390" y="875" text-anchor="middle" font-size="22" font-weight="700" fill="#111">SNS</text>
  <text x="390" y="910" text-anchor="middle" font-size="16" fill="#111">topic x evento:</text>
  <text x="390" y="934" text-anchor="middle" font-size="16" fill="#111">confirmación y</text>
  <text x="390" y="958" text-anchor="middle" font-size="16" fill="#111">recordatorio</text>
  <text x="390" y="994" text-anchor="middle" font-size="14" fill="#333">(endpoint interfaz)</text>

  <!-- Caja: CloudWatch -->
  <rect x="525" y="838" width="210" height="190" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="630" y="875" text-anchor="middle" font-size="22" font-weight="700" fill="#111">CloudWatch</text>
  <text x="630" y="910" text-anchor="middle" font-size="16" fill="#111">Logs</text>
  <text x="630" y="994" text-anchor="middle" font-size="14" fill="#333">(endpoint interfaz)</text>

  <!-- Caja: ECR -->
  <rect x="765" y="838" width="210" height="190" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="870" y="875" text-anchor="middle" font-size="22" font-weight="700" fill="#111">ECR</text>
  <text x="870" y="910" text-anchor="middle" font-size="16" fill="#111">descarga</text>
  <text x="870" y="934" text-anchor="middle" font-size="16" fill="#111">de la imagen</text>
  <text x="870" y="994" text-anchor="middle" font-size="14" fill="#333">(endpoint interfaz)</text>

  <!-- Flecha SNS -> Correo -->
  <line x1="390" y1="1028" x2="390" y2="1070" stroke="#111" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="408" y="1056" font-size="16" fill="#111">mail</text>

  <!-- Caja: Correo del usuario -->
  <rect x="270" y="1076" width="240" height="55" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="390" y="1112" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Correo del usuario</text>
</svg>
