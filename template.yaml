AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sistema de inscripcion y recordatorios para eventos (S3 + API GW + Lambda + DynamoDB + EventBridge + SNS)

Parameters:
  CorreoRemitente:
    Type: String
    Description: Email del remitente/organizador para las confirmaciones y recordatorios
    Default: organizador@example.com

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    Environment:
      Variables:
        TABLA_EVENTOS: !Ref TablaEventos
        TABLA_INSCRIPCIONES: !Ref TablaInscripciones
        CORREO_REMITENTE: !Ref CorreoRemitente

Resources:

  # ---------- Datos ----------
  TablaEventos:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Eventos
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: eventoId, AttributeType: S }
      KeySchema:
        - { AttributeName: eventoId, KeyType: HASH }

  TablaInscripciones:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Inscripciones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: inscripcionId, AttributeType: S }
        - { AttributeName: eventoId, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: inscripcionId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: porEvento
          KeySchema:
            - { AttributeName: eventoId, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: porEmail
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  # ---------- API ----------
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['Content-Type']
        AllowMethods: ['GET', 'POST', 'OPTIONS']

  ListarEventos:
    Type: AWS::Serverless::Function
    Properties:
      Handler: listar_eventos/app.handler
      CodeUri: src/listar_eventos
      Events:
        GetEventos:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /eventos, Method: GET }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TablaEventos }

  Inscribir:
    Type: AWS::Serverless::Function
    Properties:
      Handler: inscribir/app.handler
      CodeUri: src/inscribir
      Environment:
        Variables:
          CORREO_REMITENTE: !Ref CorreoRemitente
      Events:
        PostInscripciones:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /inscripciones, Method: POST }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TablaEventos }
        - DynamoDBCrudPolicy: { TableName: !Ref TablaInscripciones }
        - Statement:
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Subscribe, sns:Publish, sns:ListTopics]
              Resource: '*'

  MisInscripciones:
    Type: AWS::Serverless::Function
    Properties:
      Handler: mis_inscripciones/app.handler
      CodeUri: src/mis_inscripciones
      Events:
        GetInscripciones:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /inscripciones, Method: GET }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TablaInscripciones }

  ColaDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: recordatorio-dlq
      MessageRetentionPeriod: 1209600   # 14 dias

  Recordatorio:
    Type: AWS::Serverless::Function
    Properties:
      Handler: recordatorio/app.handler
      CodeUri: src/recordatorio
      Events:
        Programado:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            DeadLetterConfig: { Type: SQS, Arn: !GetAtt ColaDLQ.Arn }
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TablaEventos }
        - SQSSendMessagePolicy: { QueueName: !GetAtt ColaDLQ.QueueName }
        - Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem]
              Resource: !GetAtt TablaEventos.Arn
            - Effect: Allow
              Action: [sns:Publish, sns:ListTopics]
              Resource: '*'

  # ---------- Sitio estatico (S3 privado + CloudFront con OAC) ----------
  # El bucket NO es publico: solo CloudFront puede leerlo (Origin Access Control).
  # El website endpoint de S3 no soporta OAC ni HTTPS, por eso se usa el origen REST.
  SitioWeb:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PoliticaSitioWeb:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SitioWeb
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SitioWeb.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistribucionSitio}'

  OacSitioWeb:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac-sitio'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DistribucionSitio:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: SitioS3
            DomainName: !GetAtt SitioWeb.RegionalDomainName
            OriginAccessControlId: !GetAtt OacSitioWeb.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: SitioS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized (AWS managed)

  # Los archivos del sitio se suben con:
  #   aws s3 sync web/dist/ s3://<nombre-del-bucket>/
  # Tras cada subida, invalidar la cache: aws cloudfront create-invalidation --distribution-id <id> --paths '/*'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  UrlSitioWeb:
    Description: URL HTTPS del sitio (CloudFront)
    Value: !Sub 'https://${DistribucionSitio.DomainName}'
  BucketSitioWeb:
    Value: !Ref SitioWeb
  DistribucionSitioId:
    Description: Necesario para invalidar la cache
    Value: !Ref DistribucionSitio
