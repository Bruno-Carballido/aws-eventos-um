AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sistema de inscripcion y recordatorios para eventos (S3 + API GW + Lambda + DynamoDB + EventBridge + SNS)

Parameters:
  CorreoRemitente:
    Type: String
    Description: Email del remitente/organizador para las confirmaciones y recordatorios
    Default: organizador@example.com

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    Environment:
      Variables:
        TABLA_EVENTOS: !Ref TablaEventos
        TABLA_INSCRIPCIONES: !Ref TablaInscripciones
        CORREO_REMITENTE: !Ref CorreoRemitente

Resources:

  # ---------- Datos ----------
  TablaEventos:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Eventos
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: eventoId, AttributeType: S }
      KeySchema:
        - { AttributeName: eventoId, KeyType: HASH }

  TablaInscripciones:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Inscripciones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: inscripcionId, AttributeType: S }
        - { AttributeName: eventoId, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: inscripcionId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: porEvento
          KeySchema:
            - { AttributeName: eventoId, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: porEmail
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  # ---------- API ----------
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['Content-Type']
        AllowMethods: ['GET', 'POST', 'OPTIONS']

  ListarEventos:
    Type: AWS::Serverless::Function
    Properties:
      Handler: listar_eventos/app.handler
      CodeUri: src/listar_eventos
      Events:
        GetEventos:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /eventos, Method: GET }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TablaEventos }

  Inscribir:
    Type: AWS::Serverless::Function
    Properties:
      Handler: inscribir/app.handler
      CodeUri: src/inscribir
      Environment:
        Variables:
          CORREO_REMITENTE: !Ref CorreoRemitente
      Events:
        PostInscripciones:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /inscripciones, Method: POST }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TablaEventos }
        - DynamoDBCrudPolicy: { TableName: !Ref TablaInscripciones }
        - Statement:
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Subscribe, sns:Publish, sns:ListTopics]
              Resource: '*'

  Recordatorio:
    Type: AWS::Serverless::Function
    Properties:
      Handler: recordatorio/app.handler
      CodeUri: src/recordatorio
      Events:
        Programado:
          Type: Schedule
          Properties: { Schedule: rate(1 hour) }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TablaEventos }
        - Statement:
            - Effect: Allow
              Action: [sns:Publish, sns:ListTopics]
              Resource: '*'

  # ---------- Sitio estatico ----------
  SitioWeb:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  PoliticaSitioWeb:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SitioWeb
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${SitioWeb.Arn}/*'

  # Los archivos del sitio (index.html) se suben con:
  #   aws s3 cp web/ s3://<nombre-del-bucket> --recursive

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  UrlSitioWeb:
    Value: !GetAtt SitioWeb.WebsiteURL
