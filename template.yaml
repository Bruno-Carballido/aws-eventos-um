AWSTemplateFormatVersion: '2010-09-09'
Description: Sistema de inscripcion y recordatorios para eventos (ECS Fargate + FastAPI + ALB en VPC propia con subredes privadas y endpoints, DynamoDB, SNS, S3)

Parameters:
  CorreoRemitente:
    Type: String
    Description: Email del remitente/organizador para las confirmaciones y recordatorios
    Default: organizador@example.com
  RolEjecucion:
    Type: String
    Description: ARN del rol LabRole de AWS Academy (arn:aws:iam::<cuenta>:role/LabRole)
  ImagenBackend:
    Type: String
    Description: URI de la imagen Docker en ECR (ej. <cuenta>.dkr.ecr.us-east-1.amazonaws.com/aws-eventos-um-backend:latest)

Resources:

  # ---------- VPC propia del proyecto ----------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: vpc-aws-eventos-um }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: igw-aws-eventos-um }

  AdjuntarInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Subredes publicas: solo el Application Load Balancer
  SubredPublicaA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: subred-publica-a }

  SubredPublicaB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: subred-publica-b }

  # Subredes privadas: tareas ECS y endpoints. Sin ruta a Internet.
  SubredPrivadaA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - { Key: Name, Value: subred-privada-a }

  SubredPrivadaB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - { Key: Name, Value: subred-privada-b }

  RutaPublica:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - { Key: Name, Value: rt-publica }

  RutaPublicaInternet:
    Type: AWS::EC2::Route
    DependsOn: AdjuntarInternetGateway
    Properties:
      RouteTableId: !Ref RutaPublica
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  AsociacionPublicaA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubredPublicaA
      RouteTableId: !Ref RutaPublica

  AsociacionPublicaB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubredPublicaB
      RouteTableId: !Ref RutaPublica

  # Sin NAT: la tabla privada no tiene ruta 0.0.0.0/0. Los servicios de AWS se alcanzan por endpoints.
  RutaPrivada:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - { Key: Name, Value: rt-privada-sin-internet }

  AsociacionPrivadaA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubredPrivadaA
      RouteTableId: !Ref RutaPrivada

  AsociacionPrivadaB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubredPrivadaB
      RouteTableId: !Ref RutaPrivada

  # ---------- Endpoints (acceso privado a servicios de AWS) ----------
  SGEndpoints:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS desde la VPC hacia los endpoints de interfaz
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.20.0.0/16

  EndpointS3:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref RutaPrivada

  EndpointDynamoDB:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref RutaPrivada

  EndpointECRApi:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubredPrivadaA, !Ref SubredPrivadaB]
      SecurityGroupIds: [!Ref SGEndpoints]

  EndpointECRDocker:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubredPrivadaA, !Ref SubredPrivadaB]
      SecurityGroupIds: [!Ref SGEndpoints]

  EndpointLogs:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubredPrivadaA, !Ref SubredPrivadaB]
      SecurityGroupIds: [!Ref SGEndpoints]

  EndpointSNS:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sns
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubredPrivadaA, !Ref SubredPrivadaB]
      SecurityGroupIds: [!Ref SGEndpoints]

  # ---------- Datos ----------
  TablaEventos:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Eventos
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: eventoId, AttributeType: S }
      KeySchema:
        - { AttributeName: eventoId, KeyType: HASH }

  TablaInscripciones:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Inscripciones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: inscripcionId, AttributeType: S }
        - { AttributeName: eventoId, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: inscripcionId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: porEvento
          KeySchema:
            - { AttributeName: eventoId, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: porEmail
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  # ---------- Registro de Contenedores ----------
  RepositorioECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: aws-eventos-um-backend
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  # ---------- Seguridad de red (ALB y tareas) ----------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso HTTP publico hacia el Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 10.20.0.0/16

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso restringido hacia las tareas ECS Fargate desde el ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.20.0.0/16
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  # ---------- Balanceador de Carga (ALB) ----------
  Balanceador:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: alb-eventos-um
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref SubredPublicaA, !Ref SubredPublicaB]
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroupBackend:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tg-eventos-backend
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPort: '8000'
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Balanceador
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupBackend

  # ---------- Cluster y Tareas ECS (Fargate) ----------
  ClusterECS:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: aws-eventos-um-cluster

  LogGroupECS:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/aws-eventos-um-backend
      RetentionInDays: 7

  DefinicionTarea:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: aws-eventos-um-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !Ref RolEjecucion
      TaskRoleArn: !Ref RolEjecucion
      ContainerDefinitions:
        - Name: backend-eventos
          Image: !Ref ImagenBackend
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: TABLA_EVENTOS
              Value: !Ref TablaEventos
            - Name: TABLA_INSCRIPCIONES
              Value: !Ref TablaInscripciones
            - Name: CORREO_REMITENTE
              Value: !Ref CorreoRemitente
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupECS
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  ServicioECS:
    Type: AWS::ECS::Service
    DependsOn:
      - ListenerHTTP
      - EndpointECRApi
      - EndpointECRDocker
      - EndpointLogs
      - EndpointSNS
      - EndpointS3
      - EndpointDynamoDB
    Properties:
      ServiceName: servicio-eventos-backend
      Cluster: !Ref ClusterECS
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref DefinicionTarea
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref SubredPrivadaA, !Ref SubredPrivadaB]
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: backend-eventos
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroupBackend

  # ---------- Escalado horizontal (1 a 3 tareas, por CPU) ----------
  ObjetivoEscalado:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: 1
      MaxCapacity: 3
      ResourceId: !Sub service/${ClusterECS}/${ServicioECS.Name}
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      RoleARN: !Ref RolEjecucion

  PoliticaEscalado:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: escalado-cpu-eventos
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ObjetivoEscalado
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

  # ---------- Sitio estatico ----------
  # CloudFront (OAC) no esta permitido en AWS Academy (cloudfront:CreateOriginAccessControl denegado),
  # por eso el sitio se sirve desde el website endpoint de S3 (HTTP).
  SitioWeb:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  PoliticaSitioWeb:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SitioWeb
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${SitioWeb.Arn}/*'

Outputs:
  ApiUrl:
    Description: URL publica del backend en el Application Load Balancer
    Value: !Sub 'http://${Balanceador.DNSName}'
  UrlSitioWeb:
    Description: URL del sitio web en S3
    Value: !GetAtt SitioWeb.WebsiteURL
  BucketSitioWeb:
    Description: Nombre del bucket S3 para alojar el frontend
    Value: !Ref SitioWeb
  RepositorioECRUri:
    Description: URI del repositorio ECR creado para la imagen del backend
    Value: !GetAtt RepositorioECR.RepositoryUri
  VpcId:
    Description: ID de la VPC creada para el proyecto
    Value: !Ref VPC
